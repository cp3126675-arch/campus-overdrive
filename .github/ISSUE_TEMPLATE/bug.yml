name: 游戏问题 / 手机反馈
description: 提交加载、操控、战斗或显示问题
title: '[Bug] '
body:
  - type: input
    id: version
    attributes:
      label: 游戏版本
      placeholder: v0.5.2
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 如何复现，预期与实际有什么不同
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: 设备与浏览器
      placeholder: OPPO 型号、微信版本或 Chrome 版本
  - type: textarea
    id: evidence
    attributes:
      label: 截图、录像或报错（可选，避免包含个人信息）
